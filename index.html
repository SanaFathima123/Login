<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveElite Cars - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Logo -->
    <div class="logo">
        <h1>
            <span class="drive">Drive</span><span class="elite">Elite</span>
        </h1>
        <h2 class="logo-sub">CARS</h2>
    </div>

    <!-- Login Form -->
    <div class="login-container">
        <form id="loginForm" class="login-box">

            <h2>Login</h2>

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

            <p id="message"></p>

        </form>
    </div>

    <script src="script.js"></script>

</body>
</html>
